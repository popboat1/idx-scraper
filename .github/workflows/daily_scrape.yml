name: Daily IDX Market Scrape & Google Drive Sync

on:
  schedule:
    # 12:00 UTC is 19:00 WIB (Asia/Jakarta), Monday through Friday
    - cron: '0 12 * * 1-5'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Target Trading Date (YYYYMMDD). Leave blank for latest completed session.'
        required: false
        default: ''
      concurrency:
        description: 'Scraper concurrent workers'
        required: false
        default: '4'
      force_recompute:
        description: 'Force re-download of already scraped symbols'
        type: boolean
        required: false
        default: false

jobs:
  scrape_and_sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Rclone
        run: |
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

      - name: Configure Rclone
        env:
          RCLONE_CONFIG_BASE64: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_BASE64" | base64 -d > ~/.config/rclone/rclone.conf
          # test rclone configuration
          rclone listremotes

      - name: Run Batch Scraper
        env:
          STOCKBIT_TOKEN: ${{ secrets.STOCKBIT_TOKEN }}
        run: |
          ARGS="--once --concurrency ${{ github.event.inputs.concurrency || '4' }}"
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            ARGS="$ARGS --target-date ${{ github.event.inputs.target_date }}"
          fi
          if [ "${{ github.event.inputs.force_recompute }}" = "true" ]; then
            ARGS="$ARGS --force-recompute"
          fi
          echo "Running: python scripts/batch_fetcher.py $ARGS"
          python scripts/batch_fetcher.py $ARGS

      - name: Sync Parquet Partitions to Google Drive
        run: |
          if [ -d "idx_data" ]; then
            echo "Starting rclone sync to gdrive:idx-mbo-data..."
            rclone copy idx_data/ gdrive:idx-mbo-data/ --transfers 4 --checkers 8 -v --stats 30s
            echo "Sync completed successfully."
          else
            echo "Warning: idx_data directory was not found. Nothing to sync."
            exit 1
          fi
