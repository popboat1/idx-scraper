idx_scraper:
  base_url: https://exodus.stockbit.com
  fixed_universe_size: 200
  concurrency: 3
  dynamic_scanner: true
  scanner_interval_sec: 300
  poll_interval_sec: 120
  azure_vm: true
  output_dir: idx_data
  ws_url: wss://wss-trading.stockbit.com/ws
  ws_hex_template: 
fees:
  us:
    commission_per_share: 0.0
    sec_fee_rate: 2.78e-05
    finra_taf_per_share: 0.000166
    min_order_value: 1.0
  idx:
    buy_commission_rate: 0.0015
    sell_commission_rate: 0.0025
    min_lot_size: 100
    tick_sizes:
    - max_price: 200
      tick: 1
    - max_price: 500
      tick: 2
    - max_price: 2000
      tick: 5
    - max_price: 5000
      tick: 10
    - max_price: 999999
      tick: 25
